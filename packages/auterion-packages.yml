notes: >-
  Auterion exposes no public REST API or web-API client SDK. Its developer
  surface is the on-device Auterion SDK (C++ app framework for AuterionOS,
  documented at docs.auterion.com) plus a set of first-party open-source
  robotics/MAVLink libraries published on the Auterion GitHub organization.
  These are source-repo distributions (not published to npm/PyPI/crates under
  an Auterion namespace at time of probe). Registries npm (@auterion/sdk),
  PyPI (auterion, auterion-sdk) all returned 404.
