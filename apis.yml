aid: auterion
name: Auterion
description: >-
  Auterion builds the software-defined operating system for autonomous drones and
  robots. Its open, vendor-independent stack — AuterionOS and the Skynode / Skynode X
  flight-compute modules — runs across drones from many manufacturers, while Auterion
  Suite provides cloud fleet management, flight data, and compliance, and Auterion
  Mission Control is the ground-control planning and flight application. Developers
  extend vehicles with the on-device Auterion SDK, a C++ app framework built on PX4,
  MAVLink, and ROS 2. Auterion does not publish a public REST/OpenAPI web API; its
  developer surface is the on-device SDK plus a set of first-party open-source MAVLink
  and PX4 libraries on GitHub. Backed by Bessemer Venture Partners and Costanoa Ventures.
